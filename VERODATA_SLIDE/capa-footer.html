<script>
  (function () {
    function moverRodapeParaCapa() {
      var rodape = document.getElementById("capa-footer");
      var capa = document.getElementById("title-slide");
      if (rodape && capa && rodape.parentNode !== capa) {
        capa.appendChild(rodape);
      }
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", moverRodapeParaCapa);
    } else {
      moverRodapeParaCapa();
    }
  })();
</script>
